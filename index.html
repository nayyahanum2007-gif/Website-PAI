<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jurnal Sholat – Al Qur'an</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <section id="jadwal" class="page active">
    <div class="hero">
      <p id="tgl" class="small"></p>
      <p id="hijri" class="small"></p>
      <p class="small" id="lokasi">Mencari lokasi…</p>
      <h1 id="nextName">–</h1>
      <div id="countdown" class="count">--:--:--</div>
      <p class="small" id="nextTime"></p>
    </div>
    <ul id="listJadwal" class="list"></ul>

    <div class="card adzan">
      <div class="row">
        <b>Adzan otomatis</b>
        <label class="sw"><input type="checkbox" id="swAdzan" aria-label="Adzan otomatis"><span></span></label>
      </div>
      <p class="small">Adzan berbunyi saat masuk waktu sholat. Halaman ini harus tetap terbuka.</p>
      <div class="row3">
        <button id="tesAdzan" class="btn">Tes adzan</button>
        <button id="tesSubuh" class="btn">Tes Subuh</button>
        <button id="stopAdzan" class="btn">Stop</button>
      </div>
    </div>
  </section>

  <section id="quran" class="page">
    <h2>Al-Qur'an</h2>
    <div class="card qbar">
      <select id="pilihSurat" aria-label="Pilih surat"></select>
      <input id="noHal" type="number" min="1" max="604" value="1" aria-label="Nomor halaman">
    </div>
    <div class="pager">
      <button id="prev" class="btn">‹ Sebelumnya</button>
      <span id="infoHal" class="small"></span>
      <button id="next" class="btn">Berikutnya ›</button>
    </div>
    <div id="mushaf" class="mushaf"></div>
    <button id="btnTerj" class="btn block">Tampilkan terjemahan</button>
    <div id="terjemah" class="hidden" style="margin-top:12px"></div>
  </section>

  <section id="kiblat" class="page">
    <h2>Arah Kiblat</h2>
    <div class="compass">
      <div class="ring"><span class="n">U</span><div id="arrow"></div></div>
    </div>
    <p id="derajat" class="center big">–</p>
    <p id="infoKiblat" class="center small">Izinkan akses lokasi untuk menghitung arah.</p>
    <button id="btnKompas" class="btn block">Aktifkan kompas</button>
  </section>

  <section id="jurnal" class="page">
    <h2>Jurnal Sholat</h2>
    <div class="card">
      <div class="bar"><div id="prog"></div></div>
      <p id="progTxt" class="small"></p>
    </div>
    <ul id="listJurnal" class="list"></ul>
    <h3>7 hari terakhir</h3>
    <div id="riwayat" class="week"></div>
    <p id="streak" class="center small"></p>
  </section>

  <section id="doa" class="page">
    <h2>Doa & Wirid</h2>
    <div class="seg">
      <button class="on" data-m="doa">Doa Harian</button>
      <button data-m="wirid">Wirid</button>
    </div>
    <div id="isiDoa"></div>
  </section>

  <nav>
    <button class="on" data-t="jadwal"><i>🕌</i>Jadwal</button>
    <button data-t="quran"><i>📖</i>Al-Qur'an</button>
    <button data-t="kiblat"><i>🧭</i>Kiblat</button>
    <button data-t="jurnal"><i>📝</i>Jurnal</button>
    <button data-t="doa"><i>🤲</i>Doa</button>
  </nav>
</div>
<audio id="audioAdzan" src="audio/adzan.mp3" preload="auto"></audio>
<audio id="audioSubuh" src="audio/adzan-subuh.mp3" preload="auto"></audio>
<script src="script.js"></script>
</body>
</html>
